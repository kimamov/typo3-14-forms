<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Main">
    <div class="max-w-4xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <article class="meetup-detail overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
            <div class="p-6 sm:p-10">
                <h1 class="mb-4 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">{event.title}</h1>

                <f:if condition="{event.canceled}">
                    <div class="mb-6 rounded-lg border border-rose-200 bg-rose-50 p-4">
                        <p class="flex items-center gap-2 text-sm font-semibold text-rose-700">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 flex-shrink-0" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <f:translate key="show.canceled" extensionName="Meetups" />
                        </p>
                    </div>
                </f:if>

                <dl class="mb-8 grid grid-cols-1 gap-6 sm:grid-cols-2">
                    <div class="flex items-start gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="mt-0.5 h-5 w-5 flex-shrink-0 text-indigo-500" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0121 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                        </svg>
                        <div>
                            <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Date</dt>
                            <dd class="text-base font-medium text-slate-900">{event.formattedDateRange}</dd>
                        </div>
                    </div>

                    <div class="flex items-start gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="mt-0.5 h-5 w-5 flex-shrink-0 text-indigo-500" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                        </svg>
                        <div>
                            <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Location</dt>
                            <dd class="text-base font-medium text-slate-900">{event.location}</dd>
                        </div>
                    </div>

                    <f:if condition="{event.maxParticipants}">
                        <div class="flex items-start gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="mt-0.5 h-5 w-5 flex-shrink-0 text-indigo-500" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
                            </svg>
                            <div>
                                <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">
                                    <f:translate key="event.max_participants" extensionName="Meetups" />
                                </dt>
                                <dd class="text-base font-medium text-slate-900">{event.maxParticipants}</dd>
                            </div>
                        </div>
                    </f:if>
                </dl>

                <div class="formatted-description text-slate-700 leading-relaxed [&amp;_p]:mb-4">
                    <f:format.html>{event.description}</f:format.html>
                </div>
            </div>
        </article>

        <div class="mt-8">
            <f:link.action action="list" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 hover:text-slate-900">
                <span aria-hidden="true">←</span>
                <f:translate key="show.back_to_list" extensionName="Meetups" />
            </f:link.action>
        </div>
    </div>
</f:section>
</html>

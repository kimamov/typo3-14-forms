<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Main">
    <div class="max-w-2xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <h1 class="mb-6 text-3xl font-bold tracking-tight text-slate-900">
            <f:translate key="new.heading" extensionName="Meetups" />
        </h1>

        <div class="mb-6">
            <f:flashMessages />
        </div>

        <f:form action="create" object="{event}" name="event" class="meetup-form space-y-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <div>
                <label for="meetup-title" class="block text-sm font-semibold text-slate-700">
                    <f:translate key="event.title" extensionName="Meetups" />
                    <span class="ml-0.5 text-rose-500" aria-hidden="true">*</span>
                </label>
                <f:form.textfield property="title" id="meetup-title" required="required" class="mt-2 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" />
            </div>

            <div>
                <label for="meetup-description" class="block text-sm font-semibold text-slate-700">
                    <f:translate key="event.description" extensionName="Meetups" />
                </label>
                <f:form.textarea property="description" id="meetup-description" rows="5" class="mt-2 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" />
            </div>

            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                <div>
                    <label for="meetup-start-date" class="block text-sm font-semibold text-slate-700">
                        <f:translate key="event.start_date" extensionName="Meetups" />
                        <span class="ml-0.5 text-rose-500" aria-hidden="true">*</span>
                    </label>
                    <f:form.textfield property="startDate" id="meetup-start-date" type="datetime-local" required="required" class="mt-2 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" />
                </div>

                <div>
                    <label for="meetup-end-date" class="block text-sm font-semibold text-slate-700">
                        <f:translate key="event.end_date" extensionName="Meetups" />
                    </label>
                    <f:form.textfield property="endDate" id="meetup-end-date" type="datetime-local" class="mt-2 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" />
                </div>
            </div>

            <div>
                <label for="meetup-location" class="block text-sm font-semibold text-slate-700">
                    <f:translate key="event.location" extensionName="Meetups" />
                    <span class="ml-0.5 text-rose-500" aria-hidden="true">*</span>
                </label>
                <f:form.textfield property="location" id="meetup-location" required="required" class="mt-2 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" />
            </div>

            <div>
                <label for="meetup-max-participants" class="block text-sm font-semibold text-slate-700">
                    <f:translate key="event.max_participants" extensionName="Meetups" />
                </label>
                <f:form.textfield property="maxParticipants" id="meetup-max-participants" type="number" class="mt-2 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" />
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full inline-flex justify-center rounded-lg bg-indigo-600 px-5 py-3 text-base font-semibold text-white shadow-sm hover:bg-indigo-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    <f:translate key="new.submit" extensionName="Meetups" />
                </button>
            </div>
        </f:form>
    </div>
</f:section>
</html>

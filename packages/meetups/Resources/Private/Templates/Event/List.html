<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />

<f:section name="Main">
    <div class="max-w-6xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="flex flex-col gap-4 mb-8 sm:flex-row sm:items-center sm:justify-between">
            <h1 class="text-3xl font-bold tracking-tight text-slate-900">
                <f:translate key="list.heading" extensionName="Meetups" />
            </h1>
            <f:link.action action="new" class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                <f:translate key="new.heading" extensionName="Meetups" />
            </f:link.action>
        </div>

        <div class="mb-6">
            <f:flashMessages />
        </div>

        <f:if condition="{events}">
            <f:then>
                <ul class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                    <f:for each="{events}" as="event">
                        <li>
                            <article class="meetup-list__item flex h-full flex-col rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:border-indigo-200 hover:shadow-md">
                                <div class="flex-1 p-6">
                                    <h2 class="mb-2 text-xl font-semibold text-slate-900">
                                        <f:link.action action="show" arguments="{event: event}" class="rounded hover:text-indigo-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
                                            {event.title}
                                        </f:link.action>
                                    </h2>

                                    <p class="mb-2 flex items-center gap-2 text-sm text-slate-600">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 flex-shrink-0 text-indigo-500" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0121 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
                                        </svg>
                                        {event.formattedDateRange}
                                    </p>

                                    <p class="mb-3 flex items-center gap-2 text-sm text-slate-600">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 flex-shrink-0 text-indigo-500" aria-hidden="true">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                                        </svg>
                                        {event.location}
                                    </p>

                                    <f:if condition="{event.canceled}">
                                        <span class="inline-flex items-center gap-1.5 rounded-full bg-rose-100 px-2.5 py-1 text-xs font-semibold text-rose-700">
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-3.5 w-3.5" aria-hidden="true">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                            </svg>
                                            <f:translate key="show.canceled" extensionName="Meetups" />
                                        </span>
                                    </f:if>
                                </div>

                                <div class="flex items-center justify-between rounded-b-2xl border-t border-slate-100 bg-slate-50 px-6 py-4">
                                    <f:link.action action="show" arguments="{event: event}" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700">
                                        <f:translate key="list.read_more" extensionName="Meetups" />
                                        <span aria-hidden="true"> →</span>
                                    </f:link.action>
                                </div>
                            </article>
                        </li>
                    </f:for>
                </ul>

                <f:if condition="{pagination.numberOfPages} > 1">
                    <nav aria-label="Pagination" class="mt-10 flex items-center justify-center gap-3">
                        <f:if condition="{pagination.previousPage}">
                            <f:then>
                                <f:link.action arguments="{currentPage: pagination.previousPage}" class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                    <span aria-hidden="true" class="mr-2">←</span>
                                    Previous
                                </f:link.action>
                            </f:then>
                            <f:else>
                                <span class="inline-flex cursor-not-allowed items-center rounded-lg border border-slate-200 bg-slate-100 px-4 py-2 text-sm font-medium text-slate-400">
                                    <span aria-hidden="true" class="mr-2">←</span>
                                    Previous
                                </span>
                            </f:else>
                        </f:if>

                        <span class="text-sm text-slate-600">
                            Page {pagination.currentPage} of {pagination.numberOfPages}
                        </span>

                        <f:if condition="{pagination.nextPage}">
                            <f:then>
                                <f:link.action arguments="{currentPage: pagination.nextPage}" class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                                    Next
                                    <span aria-hidden="true" class="ml-2">→</span>
                                </f:link.action>
                            </f:then>
                            <f:else>
                                <span class="inline-flex cursor-not-allowed items-center rounded-lg border border-slate-200 bg-slate-100 px-4 py-2 text-sm font-medium text-slate-400">
                                    Next
                                    <span aria-hidden="true" class="ml-2">→</span>
                                </span>
                            </f:else>
                        </f:if>
                    </nav>
                </f:if>
            </f:then>
            <f:else>
                <div class="rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 p-12 text-center">
                    <p class="text-lg text-slate-600">
                        <f:translate key="list.no_events" extensionName="Meetups" />
                    </p>
                    <f:link.action action="new" class="mt-4 inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700">
                        <f:translate key="new.heading" extensionName="Meetups" />
                    </f:link.action>
                </div>
            </f:else>
        </f:if>
    </div>
</f:section>
</html>

<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>

<f:layout name="Default" />

<f:section name="Main">
    <header class="border-b border-slate-200 bg-white">
        <f:render partial="Navigation/SealSearchbar"/>
        <nav class="mx-auto flex max-w-6xl items-center justify-center px-4 py-4 sm:px-6 lg:px-8">
            <ul class="flex flex-wrap items-center justify-center gap-1 sm:gap-2">
                <f:for each="{menu}" as="menuItem">
                    <li>
                        <f:if condition="{menuItem.active}">
                            <f:then>
                                <a
                                    class="inline-flex items-center rounded-lg bg-indigo-50 px-3 py-2 text-sm font-medium text-indigo-700 transition-colors"
                                    href="{menuItem.link}"
                                    target="{menuItem.target}"
                                    title="{menuItem.title}"
                                    aria-current="page"
                                >
                                    {menuItem.title}
                                </a>
                            </f:then>
                            <f:else>
                                <a
                                    class="inline-flex items-center rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900"
                                    href="{menuItem.link}"
                                    target="{menuItem.target}"
                                    title="{menuItem.title}"
                                >
                                    {menuItem.title}
                                </a>
                            </f:else>
                        </f:if>
                    </li>
                </f:for>
            </ul>
        </nav>
    </header>
    <main class="w-full">
        <f:cObject typoscriptObjectPath="styles.content.get" />
    </main>
</f:section>

</html>

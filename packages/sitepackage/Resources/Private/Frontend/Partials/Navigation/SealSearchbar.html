<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<form action="{f:uri.page(pageUid: 6)}" method="get" class="search-navigation-form">
    <!-- Route the request to the seal Search plugin on the search page -->
    <input type="hidden" name="tx_seal_search[action]" value="search" />
    <input type="hidden" name="tx_seal_search[controller]" value="Search" />

    <div class="search-group">
        <input type="text"
               name="tx_seal_search[search]"
               placeholder="Search meetups..."
               required />

        <button type="submit">Search</button>
    </div>
</form>
</html>

<f:if condition="{pagination.allPageNumbers -> f:count()} > 1">
    <nav aria-label="{f:translate(key: 'search.page.navigation')}" class="mt-10 flex items-center justify-center gap-2">
        <f:for each="{pagination.allPageNumbers}" as="page">
            <f:if condition="{currentPageNumber} == {page}">
                <f:then>
                    <span class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-600 text-sm font-semibold text-white" aria-current="page">
                        {page}
                    </span>
                </f:then>
                <f:else>
                    <f:link.action
                        arguments="{currentPageNumber:page}"
                        addQueryString="1"
                        class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-slate-300 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-slate-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                        {page}
                    </f:link.action>
                </f:else>
            </f:if>
        </f:for>
    </nav>
</f:if>

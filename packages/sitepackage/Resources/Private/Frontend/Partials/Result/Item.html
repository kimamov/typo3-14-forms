<article class="search-result__item flex flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:border-indigo-200 hover:shadow-md">
    <div class="flex flex-col sm:flex-row">
        <f:if condition="{item.preview}">
            <div class="sm:w-2/5 lg:w-1/3">
                <a href="{item.uri}" class="block h-full">
                    <img src="{item.preview}" alt="{item.title}" class="h-48 w-full object-cover sm:h-full" />
                </a>
            </div>
        </f:if>

        <div class="flex flex-1 flex-col p-6">
            <h3 class="mb-2 text-xl font-semibold text-slate-900">
                <a href="{item.uri}" class="rounded hover:text-indigo-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
                    <f:format.raw>{item.title}</f:format.raw>
                </a>
            </h3>

            <p class="mb-4 flex-1 text-slate-600">
                {item.content}
            </p>

            <div class="mt-auto">
                <a href="{item.uri}" class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    open
                    <span aria-hidden="true" class="ml-2">→</span>
                </a>
            </div>
        </div>
    </div>

    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 border-t border-slate-100 bg-slate-50 px-6 py-3 text-xs text-slate-500">
        <span>Indexed at <f:format.date date="{item.indexdate}" format="d.m.Y H:i"></f:format.date></span>
        <f:if condition="{item.extension}">
            <span>Type: {item.extension}</span>
        </f:if>
        <f:if condition="{item.size}">
            <span>Size: {item.size -> f:format.bytes()}</span>
        </f:if>
        <f:if condition="{item.score}">
            <span>Score: {item.score}</span>
        </f:if>
    </div>
</article>

<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<section class="w-full bg-slate-50 py-16 sm:py-20">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
        <f:if condition="{data.header}">
            <h2 class="mt-0 mb-10 text-center text-3xl font-bold tracking-tight text-slate-900">{data.header}</h2>
        </f:if>

        <f:variable name="cardClass" value="flex flex-col items-center justify-center rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm transition hover:-translate-y-1 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-rose-500" />

        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
            <f:for each="{data.categories}" as="category">
                <f:if condition="{category.link.url}">
                    <f:then>
                        <f:link.typolink parameter="{category.link}" class="{cardClass}">
                            <f:render partial="Icon" arguments="{icon: category.icon}" />
                            <span class="font-semibold text-slate-900">{category.title}</span>
                        </f:link.typolink>
                    </f:then>
                    <f:else>
                        <div class="{cardClass}">
                            <f:render partial="Icon" arguments="{icon: category.icon}" />
                            <span class="font-semibold text-slate-900">{category.title}</span>
                        </div>
                    </f:else>
                </f:if>
            </f:for>
        </div>
    </div>
</section>

</html>

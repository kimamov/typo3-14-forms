<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<section class="w-full bg-rose-600 py-16 sm:py-20">
    <div class="mx-auto max-w-4xl px-4 text-center sm:px-6 lg:px-8">
        <h2 class="mt-0 mb-4 text-3xl font-bold text-white sm:text-4xl">{data.header}</h2>

        <f:if condition="{data.bodytext}">
            <div class="mb-8 text-lg text-rose-100">
                <f:format.html>{data.bodytext}</f:format.html>
            </div>
        </f:if>

        <f:if condition="{data.cta_link.url}">
            <f:link.typolink parameter="{data.cta_link}" class="inline-flex items-center rounded-full bg-white px-8 py-3 text-base font-semibold text-rose-600 shadow-lg transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-rose-600">
                <f:if condition="{data.cta_label}">
                    <f:then>{data.cta_label}</f:then>
                    <f:else>Tritt Meetup bei</f:else>
                </f:if>
            </f:link.typolink>
        </f:if>
    </div>
</section>

</html>
